<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 관리실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e8; --panel:#fffdf8; --ink:#1d1c1a; --sub:#6b675f; --line:#e2ddd1; --soft:#ece7db;
  --idea:#7a6ff0; --active:#1f9d6b; --paused:#d98a1c; --done:#2f6fdb; --trash:#c8423b;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:1380px;margin:0 auto;padding:22px 20px 80px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand h1{margin:0;font-size:30px;letter-spacing:-.03em;font-weight:700;display:flex;align-items:center;gap:10px}
.brand h1 .dot{width:14px;height:14px;border-radius:4px;background:conic-gradient(var(--active) 0 25%,var(--paused) 0 50%,var(--idea) 0 75%,var(--done) 0)}
.brand p{margin:4px 0 0;color:var(--sub)}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{font-size:12px;color:var(--sub);padding:6px 10px;border:1px dashed var(--line);border-radius:99px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.danger{background:var(--trash);border-color:var(--trash)}
.btn:disabled{opacity:.4;cursor:default}

/* stats */
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-1px);border-color:#cfc8b8}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat.warn{background:#fff4e6;border-color:#f1d2a6}

/* checker */
.checker{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px}
.checker label{font-size:12px;opacity:.7;display:block;margin-bottom:6px}
.checker .row{display:flex;gap:8px}
.checker input{flex:1;background:#2c2b28;border:1px solid #45433e;border-radius:10px;padding:11px 13px;color:#fff;font-size:15px;outline:none}
.checker input:focus{border-color:#8f8a7e}
.checker .btn{background:#fff;color:var(--ink);border-color:#fff}
.simlist{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sim{background:#2c2b28;border:1px solid #45433e;border-radius:12px;padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sim:hover{border-color:#bbb}
.sim .pct{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:2px 6px;border-radius:6px;background:#45433e}
.sim .pct.hi{background:var(--trash)}
.simnote{font-size:13px;opacity:.8;margin-top:10px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:none;padding:10px 14px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--soft);padding:1px 6px;border-radius:6px;margin-left:4px}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:12px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters input{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:12px;min-width:180px;outline:none;margin-left:auto}

/* sleeping */
.sleep{background:#fff4e6;border:1px solid #f1d2a6;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.sleep h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.sleep .items{display:flex;gap:8px;flex-wrap:wrap}
.sleep .it{background:#fff;border:1px solid #f1d2a6;border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.sleep .it em{font-style:normal;color:var(--paused);font-family:"IBM Plex Mono",monospace;font-size:11px;margin-left:6px}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:var(--r);padding:8px;min-height:200px}
.col.over{outline:2px dashed var(--ink);outline-offset:-4px}
.colh{display:flex;align-items:center;gap:7px;padding:4px 6px 10px;font-weight:700;font-size:13px}
.colh i{width:9px;height:9px;border-radius:50%}
.colh .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.12s;position:relative}
.card:hover{border-color:#bdb5a3;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.card.dragging{opacity:.4}
.card .t{font-weight:600;font-size:14px;line-height:1.35;padding-right:6px}
.card .meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--sub);flex-wrap:wrap}
.cat{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--sub);font-weight:500}
.age{font-family:"IBM Plex Mono",monospace}
.age.old{color:var(--paused);font-weight:600}
.card .nx{font-size:12px;color:var(--sub);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.svc{display:inline-flex;align-items:center;color:var(--ink)}
.svc.web,.ext.web{color:#0e8f8a}
.ext{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12px;white-space:nowrap}
.ext:hover{text-decoration:underline}
.urlrow{display:flex;gap:5px}
.urlrow input{flex:1;min-width:0}
.fld>label svg{vertical-align:-2px;margin-right:2px}
.vis{font-family:"IBM Plex Mono",monospace;color:#0e8f8a;font-weight:600}
.visbox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.visbox div{background:#eef8f7;border-radius:10px;padding:8px 10px}
.visbox b{display:block;font-size:18px}
.visbox span{font-size:11px;color:var(--sub)}
.newb{display:inline-block;font-size:9.5px;font-weight:700;background:var(--trash);color:#fff;border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:2px;letter-spacing:.03em}
.inbox{background:#eef6ff;border:1px solid #c7dcf3;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.inbox h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.inbox h3 span{font-weight:400;color:var(--sub);font-size:12px}
.inbox h3 .x{margin-left:auto;font-size:15px}
.ilist{display:flex;flex-direction:column;gap:5px}
.irow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d7e5f5;border-radius:10px;padding:6px 9px;font-size:13px;flex-wrap:wrap}
.isrc{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--sub)}
.isrc.artifact{background:#f3efff;color:#6a5ed6}.isrc.github{background:#f1f0ee;color:#333}.isrc.netlify{background:#e6f6f5;color:#0e8f8a}
.it2{font-weight:600}
.iarrow{color:var(--sub);font-size:12px}
.iarrow b{color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:#bbb}
.irow .btn{margin-left:auto}
.rdots{display:flex;gap:3px;margin-left:auto}
.rdots s{width:6px;height:6px;border-radius:50%;background:var(--line);text-decoration:none}
.rdots s.on{background:var(--active)}

/* list */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:600;background:#faf7f0;cursor:pointer;user-select:none;white-space:nowrap}
tr.r:hover td{background:#faf7f0;cursor:pointer}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%}
.tblwrap{overflow-x:auto}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-bottom:18px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rule h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.rule p{margin:6px 0 10px;color:var(--sub);font-size:13px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0}
.bar b{display:block;height:100%;background:var(--active)}
.miss{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.miss span{font-size:11px;background:var(--soft);padding:2px 7px;border-radius:6px}
.scope{font-size:11px;font-weight:500;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--sub)}
.matrix th.rc{writing-mode:vertical-rl;transform:rotate(180deg);height:120px;text-align:left;font-size:12px}
.matrix td.c{text-align:center}
.matrix input{width:16px;height:16px;accent-color:var(--active)}
.matrix td.na{color:#ccc;text-align:center}

/* cleanup */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 4px;font-size:15px}
.sec .d{color:var(--sub);font-size:13px;margin:0 0 10px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.lrow:first-of-type{border-top:none}
.kind{font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--sub);min-width:34px;text-align:center}
.kind.main{background:#e3f4ec;color:var(--active)}
.lrow a{flex:1;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow a:hover{text-decoration:underline}
.lrow .app{color:var(--sub);font-size:12px;white-space:nowrap}
.flag{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:12px;white-space:nowrap}
.flag.on{background:var(--trash);border-color:var(--trash);color:#fff}
.empty{padding:30px;text-align:center;color:var(--sub)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,19,17,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:21;transform:translateX(100%);transition:.25s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh input{flex:1;border:none;font-size:21px;font-weight:700;background:transparent;outline:none;letter-spacing:-.02em;min-width:0}
.dbody{flex:1;overflow-y:auto;padding:14px 18px 30px}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.fld textarea,.fld input[type=text],.fld input[type=date],.fld select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none;resize:vertical}
.fld textarea:focus,.fld input:focus{border-color:var(--ink)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.seg button i{width:7px;height:7px;border-radius:50%}
.seg button.on{color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld:nth-child(3){grid-column:1 / -1}
.kids{display:flex;flex-direction:column;gap:3px;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line)}
.kid{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 6px;border-radius:7px;background:var(--soft)}
.kid:hover{background:#e4ddcc}
.kid i{width:6px;height:6px;border-radius:50%;flex:none}
.kid em{font-style:normal;margin-left:auto;color:var(--sub);font-family:"IBM Plex Mono",monospace;font-size:10px}
tr.sub td{background:#fcfaf5;font-size:12px}
.subm{color:var(--sub);margin:0 6px 0 8px}
.kidn{font-size:10px;background:var(--soft);padding:1px 6px;border-radius:5px;margin-left:6px;color:var(--sub);font-weight:500}
.rchk{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;margin-bottom:5px;font-size:13px;background:#fff}
.rchk input{margin-top:3px;accent-color:var(--active)}
.rchk small{display:block;color:var(--sub);font-size:11px}
.addl{display:grid;grid-template-columns:1fr 1fr 90px auto;gap:5px;margin-top:8px}
.addl input,.addl select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;min-width:0}
.dfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:none;font-size:20px;line-height:1;color:var(--sub);padding:4px}

/* modal, toast */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(20,19,17,.4);padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 6px}
.ver{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:8px;padding:3px 8px;vertical-align:middle;letter-spacing:0}
.ver:hover{border-color:var(--ink);color:var(--ink)}
.mbox.wide{width:min(900px,100%);padding:0;display:flex;flex-direction:column;max-height:92vh}
.vh{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
.vh h3{margin:0;font-size:18px}
.vh .vnum{font-family:"IBM Plex Mono",monospace;background:var(--ink);color:#fff;border-radius:7px;padding:2px 8px;font-size:13px}
.vtabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line)}
.vbody{padding:16px 20px 22px;overflow-y:auto}
.vlog{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.vlog .e{position:relative;margin-bottom:16px}
.vlog .e::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--panel)}
.vlog .e.cur::before{background:var(--active)}
.vlog .e b{font-family:"IBM Plex Mono",monospace}
.vlog .e .dt{color:var(--sub);font-size:12px;margin-left:6px}
.vlog .e .tt{font-weight:600;margin-left:6px}
.vlog ul{margin:5px 0 0;padding-left:18px;color:#3a3833;font-size:13px}
.vlog li{margin:2px 0}
.dg{width:100%;height:auto;display:block;background:#faf7f0;border:1px solid var(--line);border-radius:14px;margin:6px 0 14px}
.dg text{font-family:"IBM Plex Sans KR",sans-serif}
.vsec h4{margin:14px 0 6px;font-size:14px}
.vsec p{margin:0 0 8px;font-size:13px;color:#3a3833}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#3a3833}
.vcard b{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
.vcard code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--soft);padding:0 4px;border-radius:4px}

.mbox p{margin:0 0 10px;color:var(--sub);font-size:13px}
.mbox textarea{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:#fff}
.mbox .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{background:#fdecea;border:1px solid #f3c3be;color:#8a2a24;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:none}
.banner.on{display:block}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .board{grid-template-columns:repeat(5,82%);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .filters input{margin-left:0;flex:1}
}
@media (max-width:520px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .brand h1{font-size:24px}
  .two{grid-template-columns:1fr}
  .addl{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="dot"></span>앱 관리실 <button class="ver" data-act="ver" id="verBtn" title="업데이트 기록과 작동 원리">v—</button></h1>
      <p>만든 앱 전부를 한눈에 — 겹치지 않게, 묻히지 않게, 규칙은 한 번에.</p>
    </div>
    <div class="hright">
      <span class="sync" id="sync">불러오는 중…</span>
      <span class="sync" id="scanInfo" title="스캔 상태">스캔 확인 중…</span>
      <button class="btn ghost" data-act="refresh" id="refreshBtn">🔄 새로고침</button>
      <button class="btn" data-act="new-app">+ 앱 추가</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div id="inbox"></div>
  <div class="stats" id="stats"></div>

  <div class="checker">
    <label>새로 만들기 전에 — 비슷한 앱이 이미 있는지 확인</label>
    <div class="row">
      <input id="chkIn" placeholder="예: 레이싱 게임, 영어 단어 공부, 일정 관리…" autocomplete="off">
      <button class="btn" data-act="chk-add">아이디어로 등록</button>
    </div>
    <div id="chkOut"></div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer"></aside>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const ST = {
  active:{l:'진행 중',c:'var(--active)'},
  paused:{l:'멈춤',c:'var(--paused)'},
  idea:{l:'아이디어',c:'var(--idea)'},
  done:{l:'완성',c:'var(--done)'},
  trash:{l:'삭제 예정',c:'var(--trash)'}
};
const ORDER = ['active','paused','idea','done','trash'];
const CATS = ['게임','학습','음악','도구','생활','아이디어'];
const KINDS = {main:'본 앱',draft:'시안',design:'디자인',doc:'문서',etc:'기타'};
const SLEEP_DAYS = 14;

let apps = [], rules = [];
let db = null, readOnly = false, loaded = {apps:false, rules:false};
let view = ['board','list','rules','clean'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'board';
let filt = {cat:'전체', q:'', st:null};
let sortBy = {k:'updated', dir:-1};
let openId = null;

const $ = s => document.querySelector(s);

/* ---------- similarity ---------- */
function grams(s){
  s = String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ');
  const out = new Set();
  s.split(' ').filter(Boolean).forEach(w => {
    if(w.length===1) out.add(w);
    for(let i=0;i<w.length-1;i++) out.add(w.slice(i,i+2));
  });
  return out;
}
function similar(q){
  const g = grams(q); if(!g.size) return [];
  return apps.map(a => {
    const hay = grams([a.name, (a.tags||[]).join(' '), a.desc, a.cat].join(' '));
    const nameG = grams(a.name);
    let hit = 0, nameHit = 0;
    g.forEach(x => { if(hay.has(x)) hit++; if(nameG.has(x)) nameHit++; });
    const score = Math.min(1, hit / g.size * 0.85 + (nameHit / g.size) * 0.3);
    return {a, score};
  }).filter(x => x.score >= 0.25).sort((x,y) => y.score - x.score).slice(0,6);
}
function dupesOf(a){
  const q = [a.name, (a.tags||[]).join(' ')].join(' ');
  return similar(q).filter(x => x.a.id !== a.id && x.score >= 0.4);
}

/* ---------- actions ---------- */
function upd(id, fn){ const a = apps.find(x=>x.id===id); if(!a) return; fn(a); save('apps'); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('on'), 2400); }
function modal(html, wide){ $('#mbox').innerHTML = html; $('#mbox').classList.toggle('wide', !!wide); $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
async function copyOut(text, title){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){}
  if(ok){ toast('복사됐어요 — Claude 채팅에 붙여넣으세요'); return; }
  modal(`<h3>${esc(title||'요청문')}</h3><p>아래 내용을 복사해서 Claude 채팅에 붙여넣으세요.</p><textarea id="cpTa" readonly>${esc(text)}</textarea><div class="acts"><button class="btn" data-act="modal-close">닫기</button></div>`);
  setTimeout(()=>{ const t = $('#cpTa'); if(t){ t.focus(); t.select(); } }, 30);
}
function newApp(name){
  if(readOnly) return;
  const a = {id:uid(), name:name||'새 앱', cat:'아이디어', status:'idea', desc:'', next:'', memo:'', tags:[], updated:todayStr(), links:[], rules:{}};
  apps.unshift(a); save('apps'); render(); openApp(a.id);
}

  modal(`<h3>${isNew?'공통 규칙 추가':'규칙 편집'}</h3><p>모든 앱(또는 게임)에 똑같이 들어가야 하는 기능·원칙.</p>
    <div class="fld"><label>이름</label><input type="text" id="rN" value="${esc(r.name)}" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px"></div>
    <div class="fld"><label>설명 — Claude가 그대로 적용할 수 있게 구체적으로</label><textarea id="rD" style="height:90px">${esc(r.desc)}</textarea></div>
    <div class="fld"><label>적용 범위</label><select id="rS" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px"><option value="all" ${r.scope==='all'?'selected':''}>전체 앱</option><option value="game" ${r.scope==='game'?'selected':''}>게임만</option></select></div>
    <div class="acts">${isNew?'':`<button class="btn ghost" style="color:var(--trash);margin-right:auto" data-act="rule-del" data-id="${r.id}">삭제</button>`}<button class="btn ghost" data-act="modal-close">취소</button><button class="btn" data-act="rule-save" data-id="${r.id}" data-new="${isNew?1:0}">저장</button></div>`);
}

document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]'); if(stop) return;
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==='tab'){ view = el.dataset.v; try{ history.replaceState(null,'','#'+view); }catch(_){} render(); }
  else if(act==='stat'){ filt.st = el.dataset.st || null; filt.cat='전체'; if(view!=='board' && view!=='list') view='board'; render(); }
  else if(act==='clear-st'){ filt.st = null; render(); }
  else if(act==='cat'){ filt.cat = el.dataset.c; render(); }
  else if(act==='sort'){ const k = el.dataset.k; sortBy = {k, dir: sortBy.k===k ? -sortBy.dir : (k==='updated'?-1:1)}; render(); }
  else if(act==='open'){ e.preventDefault(); openApp(id); }
  else if(act==='close'){ closeApp(); }
  else if(act==='new-app'){ newApp(''); }
  else if(act==='chk-add'){ const q = $('#chkIn').value.trim(); if(!q){ $('#chkIn').focus(); return; } newApp(q); $('#chkIn').value=''; renderChecker(); }
  else if(act==='set-st'){ upd(openId, a => a.status = el.dataset.st); render(); }
  else if(act==='today'){ e.preventDefault(); upd(openId, a => a.updated = todayStr()); render(); }
  else if(act==='flag'){ upd(el.dataset.a, a => { const l = a.links.find(x=>x.id===el.dataset.l); if(l) l.del = !l.del; }); render(); }
  else if(act==='unlink'){ upd(openId, a => a.links = a.links.filter(x=>x.id!==el.dataset.l)); render(); }
  else if(act==='add-link'){
    const t = $('#nlT').value.trim(), u = $('#nlU').value.trim(), k = $('#nlK').value;
    if(!/^https?:\/\//.test(u)){ toast('링크 주소를 확인해 주세요'); return; }
    upd(openId, a => { a.links = a.links||[]; a.links.push({id:uid(), title:t||u, url:u, kind:k, del:false}); }); render();
  }
  else if(act==='continue'){
    const a = apps.find(x=>x.id===openId); const m = mainLink(a);
    copyOut(`"${a.name}" 이어서 작업하자.\n${m?'링크: '+m.url+'\n':''}${a.github?'GitHub: '+fullUrl(a.github)+'\n':''}${a.netlify?'배포: '+fullUrl(a.netlify)+'\n':''}${a.desc?'설명: '+a.desc+'\n':''}${a.next?'다음 할 일: '+a.next+'\n':''}${a.memo?'메모: '+a.memo+'\n':''}`, '이어서 작업 요청');
  }
  else if(act==='remove-app'){
    const a = apps.find(x=>x.id===openId);
    modal(`<h3>"${esc(a.name)}"를 관리실에서 뺄까요?</h3><p>관리실 목록에서만 지워져요. 실제 아티팩트를 지우려면 상태를 '삭제 예정'으로 바꾸고 정리함에서 삭제 요청을 보내세요.</p>
      <div class="acts"><button class="btn ghost" data-act="modal-close">취소</button><button class="btn ghost" data-act="to-trash">삭제 예정으로</button><button class="btn danger" data-act="remove-ok">관리실에서 빼기</button></div>`);
  }
  else if(act==='to-trash'){ upd(openId, a => a.status='trash'); closeModal(); render(); }
  else if(act==='remove-ok'){ apps = apps.filter(x=>x.id!==openId); save('apps'); closeModal(); closeApp(); render(); }
  else if(act==='modal-close'){ closeModal(); }
  else if(act==='ver'){ verPanel('log'); }
  else if(act==='vtab'){ verPanel(el.dataset.t); }
  else if(act==='rchk' || act==='mx'){
    const aid = act==='rchk' ? openId : el.dataset.a; const rid = el.dataset.r;
    upd(aid, a => { a.rules = a.rules||{}; a.rules[rid] = el.checked; });
    setTimeout(render, 0);
  }
  else if(act==='rule-new'){ ruleEditor(null); }
  else if(act==='rule-edit'){ ruleEditor(rules.find(r=>r.id===id)); }
  else if(act==='rule-save'){
    const name = $('#rN').value.trim(); if(!name){ toast('이름을 적어 주세요'); return; }
    const data = {id, name, desc:$('#rD').value.trim(), scope:$('#rS').value};
    if(el.dataset.new==='1') rules.push(data); else rules = rules.map(r => r.id===id ? data : r);
    save('rules'); closeModal(); render();
  }
  else if(act==='rule-del'){ rules = rules.filter(r=>r.id!==id); save('rules'); closeModal(); render(); }
  else if(act==='rule-req'){
    const r = rules.find(x=>x.id===id);
    const miss = apps.filter(a => a.status!=='trash' && ruleFits(r,a) && !(a.rules&&a.rules[r.id]));
    copyOut(`아래 앱들에 공통 규칙 「${r.name}」을 적용해줘.\n규칙 내용: ${r.desc}\n\n${miss.map(a=>{const m=mainLink(a);return `- ${a.name}${m?' — '+m.url:''}`;}).join('\n')}\n\n적용한 앱은 앱 관리실에서도 체크해줘.`, '규칙 적용 요청');
  }
  else if(act==='del-req'){
    const lines = [];
    apps.filter(a=>a.status==='trash').forEach(a => (a.links||[]).forEach(l => lines.push(`- ${l.title} — ${l.url} (앱: ${a.name}, 삭제 예정)`)));
    apps.filter(a=>a.status!=='trash').forEach(a => (a.links||[]).filter(l=>l.del).forEach(l => lines.push(`- ${l.title} — ${l.url} (앱: ${a.name})`)));
    copyOut(`앱 관리실 정리함에 있는 아래 아티팩트들을 삭제해줘.\n\n${lines.join('\n')}\n\n삭제가 끝나면 앱 관리실에서도 해당 항목을 정리해줘.`, '삭제 요청');
  }
  else if(act==='refresh'){ refreshAll(); }
  else if(act==='undo'){ undoLog(+el.dataset.i); }
  else if(act==='inbox-clear'){ seen.log = []; save('seen'); renderInbox(); }
  else if(act==='visit-req'){
    copyOut(`앱 관리실의 Netlify 방문자 수를 최신으로 업데이트해줘. Netlify 프로젝트 목록도 다시 확인해서 새 배포 주소가 있으면 채워줘.`, '방문자 새로고침 요청');
  }
  else if(act==='sync-req'){
    copyOut(`앱 관리실을 내 아티팩트 전체 목록과 동기화해줘. 새로 생긴 아티팩트는 알맞은 앱에 묶거나 새 앱으로 추가하고, 마지막 작업일도 최신으로 맞춰줘.`, '동기화 요청');
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='q'){ filt.q = e.target.value; const pos = e.target.selectionStart; renderView(); const q = $('#q'); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){}; return; }
  if(e.target.id==='chkIn'){ renderChecker(); return; }
  const f = e.target.dataset.f; if(!f || !openId) return;
  upd(openId, a => { a[f] = f==='tags' ? e.target.value.split(',').map(s=>s.trim()).filter(Boolean) : e.target.value; });
  clearTimeout(window._rv); window._rv = setTimeout(() => { renderStats(); renderTabs(); renderView(); }, 300);
});
document.addEventListener('change', e => {
  const f = e.target.dataset.f; if(!f || !openId) return;
  if(f==='parent'){ upd(openId, a => a.parent = e.target.value); render(); toast(e.target.value ? '「'+parentOf(apps.find(x=>x.id===openId)).name+'」 아래로 묶었어요' : '독립 앱으로 뺐어요'); return; }
  if(f==='cat' || f==='updated'){ upd(openId, a => a[f] = e.target.value); render(); }
  if(f==='github' || f==='netlify'){ upd(openId, a => { a[f] = e.target.value.trim(); if(f==='github' && a[f]){ a.rules = a.rules||{}; if(rules.some(r=>r.id==='r5')) a.rules.r5 = true; } }); render(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if($('#modal').classList.contains('on')) closeModal(); else closeApp(); }
  if(e.key==='Enter' && e.target.id==='chkIn'){ const s = similar(e.target.value); if(s.length) openApp(s[0].a.id); }
});
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

/* drag between columns */
function bindDnD(){
  document.querySelectorAll('.card[draggable]').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); upd(id, a => a.status = col.dataset.col); render(); toast('상태를 「'+ST[col.dataset.col].l+'」로 바꿨어요'); });
  });
}

$('#verBtn').textContent = VERSION;
init();
</script>
</body>
</html>
